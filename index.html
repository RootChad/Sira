<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sira — Un voyage à travers la vie du Prophète Muhammad ﷺ</title>
<meta name="description" content="Découvrir la Sira, la vie du Prophète Muhammad ﷺ, à travers une frise chronologique, des cartes et des chiffres.">
<meta name="theme-color" content="#0d1328">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%23d9b45a'%3E%3Crect x='5' y='5' width='14' height='14'/%3E%3Crect x='5' y='5' width='14' height='14' transform='rotate(45 12 12)'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%230d1328'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Amiri:wght@400;700&family=Marcellus&family=Noto+Naskh+Arabic:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/story.css">
</head>
<body>
<!-- Rosace à huit branches (khatam), utilisée par le logo et la carte -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Rosace à huit branches (khatam) -->
    <symbol id="rosette" viewBox="0 0 40 40"><g fill="currentColor"><rect x="9" y="9" width="22" height="22"/><rect x="9" y="9" width="22" height="22" transform="rotate(45 20 20)"/></g><circle cx="20" cy="20" r="7" style="fill:var(--bg)"/><circle cx="20" cy="20" r="3.2" fill="currentColor"/></symbol>
  </defs>
</svg>

<a class="skip" href="#main" data-i18n="skip">Aller au contenu</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top" aria-label="Sira">
      <svg class="brand-mark" aria-hidden="true"><use href="#rosette"/></svg>
      <span class="brand-lat">Sira</span>
      <span class="brand-ar" lang="ar">السيرة</span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#ch-intro" data-i18n="nav.journey">Le voyage</a>
      <a href="#map" data-i18n="nav.map">Carte</a>
      <a href="#numbers" data-i18n="nav.numbers">Chiffres</a>
      <a href="#family" data-i18n="nav.family">Famille</a>
      <a href="#quiz" data-i18n="nav.quiz">Quiz</a>
    </nav>
    <div class="tools">
      <button type="button" class="icon-btn" id="chaptersBtn" aria-expanded="false" aria-controls="drawer" data-i18n-aria="chapters" aria-label="Chapitres">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button type="button" class="icon-btn" id="soundBtn" data-sound aria-pressed="false" data-i18n-aria="soundOn" aria-label="Activer l'ambiance sonore">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="snd-wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="snd-off" d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <div class="lang" role="group" data-i18n-aria="langLabel" aria-label="Langue">
        <button type="button" data-lang="fr" lang="fr">FR</button>
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ar" lang="ar" class="lang-ar">ع</button>
      </div>
      <button type="button" class="theme-btn icon-btn" id="themeBtn" data-i18n-aria="themeToggle" aria-label="Changer de thème">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><path class="moon" d="M15.5 3.6a8.6 8.6 0 1 0 5 13.6A7 7 0 0 1 15.5 3.6z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Scène du voyage : ciel, paysages, foules (décor, sans contenu à lire) -->
<div class="stage" id="stage" aria-hidden="true">
  <canvas id="skyCanvas"></canvas>
  <svg id="sceneSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"></svg>
  <svg id="stageMap" viewBox="0 0 600 760" preserveAspectRatio="xMidYMid meet"></svg>
  <p class="map-caption" id="mapCaption"></p>
  <canvas id="glCanvas" hidden></canvas>
  <canvas id="fxCanvas"></canvas>
  <div class="stage-shade"></div>
</div>

<!-- Le monde 3D : données en direct et découvertes à toucher sur le terrain -->
<div class="world-tele world-ui" id="worldTele" aria-live="off"></div>
<div class="world-hot world-ui" id="worldHot"></div>
<!-- Simulation d'une bataille : les phases, une à une -->
<section class="sim-panel world-ui" id="battlePanel" hidden aria-live="polite">
  <p class="bt-step"></p>
  <h3 class="bt-title"></h3>
  <p class="bt-text"></p>
  <div class="bt-row">
    <div class="bt-steps" role="group" data-i18n-aria="phase" aria-label="Phase"></div>
    <button type="button" class="bt-replay icon-btn" data-i18n-aria="replay" aria-label="Revoir depuis le début"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
  </div>
</section>
<!-- Le lieu en vrai : une photographie du lieu du chapitre -->
<button type="button" class="place-photo" id="placePhoto" hidden aria-haspopup="dialog">
  <img alt=""><span class="pp-label" data-i18n="placeToday">Le lieu en vrai</span><span class="pp-n"></span>
</button>
<div class="discover" id="discoverCard" hidden role="dialog" aria-modal="false" aria-labelledby="discoverTitle">
  <button type="button" class="icon-btn dc-close" data-i18n-aria="close" aria-label="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <p class="dc-kicker" data-i18n="discover">Découverte</p>
  <h3 id="discoverTitle"></h3>
  <p class="dc-text"></p>
  <p class="dc-data"></p>
  <button type="button" class="dc-photo" hidden><img alt=""><span data-i18n="placeToday">Le lieu en vrai</span></button>
</div>

<main id="main">
  <div class="story" id="story">
    <section class="st-intro" id="ch-intro">
      <div class="st-intro-inner">
        <p class="st-intro-ar" lang="ar">السيرة النبوية</p>
        <h1>Un voyage à travers la vie du Prophète Muhammad ﷺ</h1>
      </div>
    </section>
  </div>

  <div class="explore">
  <div class="band" aria-hidden="true"></div>

  <!-- CARTE -->
  <section class="section section-map" id="map">
    <div class="wrap">
      <header class="section-head">
        <p class="kicker" lang="ar">الطرق</p>
        <h2 data-i18n="mapTitle">Les chemins de la Sira</h2>
        <p class="lead" data-i18n="mapLead"></p>
      </header>
      <div class="map-layout">
        <div class="map-frame">
          <svg id="mapSvg" class="map-svg" viewBox="0 0 600 760" role="img" aria-labelledby="mapTitleSr">
            <title id="mapTitleSr">Carte</title>
          </svg>
          <button type="button" class="map-zoom" id="mapZoom" data-i18n="zoomHijaz">Zoom sur le Hijaz</button>
        </div>
        <div class="map-panel">
          <div class="route-list" id="routeList" role="group"></div>
          <div class="map-info" id="mapInfo" aria-live="polite"></div>
          <p class="note" data-i18n="mapNote"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- CHIFFRES -->
  <section class="section wrap" id="numbers">
    <header class="section-head">
      <p class="kicker" lang="ar">بالأرقام</p>
      <h2 data-i18n="numbersTitle">En chiffres</h2>
      <p class="lead" data-i18n="numbersLead"></p>
    </header>
    <div class="charts">
      <figure class="chart chart-wide">
        <figcaption><h3 data-i18n="periodsTitle"></h3><p data-i18n="periodsLead"></p></figcaption>
        <div id="periodsChart"></div>
      </figure>
      <figure class="chart">
        <figcaption><h3 data-i18n="growthTitle"></h3><p data-i18n="growthLead"></p></figcaption>
        <div id="growthChart"></div>
      </figure>
      <figure class="chart">
        <figcaption><h3 data-i18n="battlesTitle"></h3><p data-i18n="battlesLead"></p></figcaption>
        <div id="battlesChart"></div>
      </figure>
    </div>
    <p class="note" data-i18n="approx"></p>
  </section>

  <!-- FAMILLE -->
  <section class="section wrap" id="family">
    <header class="section-head">
      <p class="kicker" lang="ar">أسرته</p>
      <h2 data-i18n="familyTitle">Sa famille</h2>
      <p class="lead" data-i18n="familyLead"></p>
    </header>
    <div class="family" id="familyBox"></div>
  </section>

  <!-- QUIZ -->
  <section class="section wrap" id="quiz">
    <header class="section-head">
      <p class="kicker" lang="ar">اختبار</p>
      <h2 data-i18n="quizTitle">Testez vos connaissances</h2>
      <p class="lead" data-i18n="quizLead"></p>
    </header>
    <div class="quiz" id="quizBox" aria-live="polite"></div>
  </section>
  </div>
</main>

<!-- Barre de vie : année, calendrier hégirien, âge -->
<div class="hud" id="hud">
  <span class="hud-play-bar" id="hudPlayBar"></span>
  <div class="hud-inner">
    <p class="hud-year"><b id="hudYear">570</b></p>
    <div class="hud-ctrl">
      <button type="button" id="hudPrev" data-i18n-aria="prevChapter" aria-label="Chapitre précédent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button type="button" id="hudPlay" aria-pressed="false" data-i18n-aria="autoplay" aria-label="Lecture automatique"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5.5v13l11-6.5z"/><path class="i-pause" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
      <button type="button" id="hudNext" data-i18n-aria="nextChapter" aria-label="Chapitre suivant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="hud-mid">
      <p class="hud-meta"><span id="hudMeta"></span> <span class="hud-title" id="hudTitle"></span></p>
      <div class="hud-track" id="hudTrack"></div>
    </div>
  </div>
</div>

<!-- Carte d'un événement, par-dessus le voyage -->
<div class="mapsheet" id="mapSheet" hidden>
  <div class="mapsheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="mapsheet-head">
      <div>
        <p class="mapsheet-date" id="sheetDate"></p>
        <h2 id="sheetTitle"></h2>
      </div>
      <button type="button" class="icon-btn" id="sheetClose" data-i18n-aria="close" aria-label="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <svg class="mapsheet-map" id="sheetMap" viewBox="0 0 600 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <p class="mapsheet-info" id="sheetInfo"></p>
    <div class="mapsheet-actions">
      <button type="button" class="st-btn st-btn-gold" id="sheetBack" data-i18n="backToJourney">Revenir au voyage</button>
      <button type="button" class="st-btn st-btn-line" id="sheetFull" data-i18n="openFullMap">Ouvrir la carte complète</button>
    </div>
  </div>
</div>

<!-- Visionneuse de photographies -->
<div class="photobox" id="photoBox" hidden role="dialog" aria-modal="true" aria-labelledby="photoTitle">
  <div class="pb-head">
    <h2 id="photoTitle"></h2>
    <span class="pb-count" id="photoCount"></span>
    <button type="button" class="icon-btn" id="photoClose" data-i18n-aria="close" aria-label="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <figure class="pb-fig">
    <img id="photoImg" alt="">
    <span class="pb-spin" aria-hidden="true"></span>
    <button type="button" class="pb-nav pb-prev icon-btn" id="photoPrev" data-i18n-aria="photoPrev" aria-label="Photo précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button type="button" class="pb-nav pb-next icon-btn" id="photoNext" data-i18n-aria="photoNext" aria-label="Photo suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <figcaption><p id="photoCap"></p><p class="pb-credit" id="photoCredit"></p></figcaption>
  </figure>
</div>

<!-- Liste des chapitres -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <h2 id="drawerTitle" data-i18n="chapters">Chapitres</h2>
      <button type="button" class="icon-btn" data-close data-i18n-aria="close" aria-label="Fermer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ol class="drawer-list" id="drawerList"></ol>
  </div>
</div>

<footer class="footer">
  <div class="band" aria-hidden="true"></div>
  <div class="wrap footer-inner">
    <p class="footer-salawat" lang="ar">صلى الله عليه وسلم</p>
    <p data-i18n="footerAbout"></p>
    <p data-i18n="footerImages"></p>
    <p class="small" data-i18n="footerSources"></p>
  </div>
</footer>

<script src="js/map-data.js"></script>
<script src="js/data.js"></script>
<script src="js/world-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/photos.js"></script>
<script src="js/story.js"></script>
<script type="module" src="js/world.js"></script>
</body>
</html>
